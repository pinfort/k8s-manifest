apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      deployment: homepage-deployment
  template:
    metadata:
      labels:
        deployment: homepage-deployment
    spec:
      serviceAccountName: homepage
      automountServiceAccountToken: true
      containers:
      - name: homepage-container
        image: ghcr.io/gethomepage/homepage:v2.8.0
        ports:
        - name: http
          containerPort: 3000
        env:
        - name: MY_POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        # Host headers Homepage accepts. The pod IP is needed for the probes;
        # 192.168.2.57 is the LoadBalancer address (port 80, so no port suffix).
        - name: HOMEPAGE_ALLOWED_HOSTS
          value: "$(MY_POD_IP):3000,192.168.2.57"
        - name: LOG_TARGETS
          value: stdout
        - name: TZ
          value: Asia/Tokyo
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          seccompProfile:
            type: RuntimeDefault
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /api/healthcheck
            port: http
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /api/healthcheck
            port: http
          periodSeconds: 10
        volumeMounts:
        # Writable /app/config: Homepage copies skeleton files for any config it
        # doesn't find (e.g. proxmox.yaml) and writes logs/ here; it crashes if it can't.
        # Our files from the ConfigMap are mounted on top.
        - { name: config-dir, mountPath: /app/config }
        - { name: config, mountPath: /app/config/settings.yaml, subPath: settings.yaml }
        - { name: config, mountPath: /app/config/services.yaml, subPath: services.yaml }
        - { name: config, mountPath: /app/config/widgets.yaml, subPath: widgets.yaml }
        - { name: config, mountPath: /app/config/bookmarks.yaml, subPath: bookmarks.yaml }
        - { name: config, mountPath: /app/config/kubernetes.yaml, subPath: kubernetes.yaml }
        - { name: config, mountPath: /app/config/docker.yaml, subPath: docker.yaml }
        - { name: config, mountPath: /app/config/custom.css, subPath: custom.css }
        - { name: config, mountPath: /app/config/custom.js, subPath: custom.js }
      volumes:
      - name: config
        configMap:
          name: homepage-config
      - name: config-dir
        emptyDir: {}
