# Not part of kustomization.yaml: apply once by hand to register the app in ArgoCD.
#   kubectl apply -f homepage/argocd-application.yaml
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: homepage
  namespace: argocd
spec:
  description: homepage
  sourceRepos:
  - '*'
  destinations:
  - name: '*'
    namespace: homepage
    server: https://kubernetes.default.svc
  clusterResourceWhitelist:
  - group: '*'
    kind: '*'
  namespaceResourceWhitelist:
  - group: '*'
    kind: '*'
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homepage
  namespace: argocd
spec:
  project: homepage
  source:
    repoURL: git@github.com:pinfort/k8s-manifest.git
    path: homepage
    targetRevision: HEAD
  destination:
    server: https://kubernetes.default.svc
    namespace: homepage
