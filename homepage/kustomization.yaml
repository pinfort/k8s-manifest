apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: homepage
commonLabels:
  app: homepage

resources:
- namespace.yaml
- rbac.yaml
- deployment.yaml
- service.yaml

# Config files live in config/. The generated name has a content hash, so
# editing a file rolls the Deployment (subPath mounts don't pick up changes).
configMapGenerator:
- name: homepage-config
  files:
  - config/settings.yaml
  - config/services.yaml
  - config/widgets.yaml
  - config/bookmarks.yaml
  - config/kubernetes.yaml
  - config/docker.yaml
  - config/custom.css
  - config/custom.js
