apiVersion: apps/v1
kind: Deployment
metadata:
  name: uptime-kuma-deployment
spec:
  replicas: 1
  # SQLite database: never run two pods at once
  strategy:
    type: Recreate
  selector:
    matchLabels:
      deployment: uptime-kuma-deployment
  template:
    metadata:
      labels:
        deployment: uptime-kuma-deployment
    spec:
      containers:
      - name: uptime-kuma-container
        image: louislam/uptime-kuma:2
        ports:
        - containerPort: 3001
        env:
        - name: TZ
          value: Asia/Tokyo
        volumeMounts:
        - name: data
          mountPath: /app/data
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 512Mi
        # Database migrations can take a while on first start / upgrades
        startupProbe:
          tcpSocket:
            port: 3001
          periodSeconds: 10
          failureThreshold: 60
        livenessProbe:
          tcpSocket:
            port: 3001
          periodSeconds: 30
          failureThreshold: 3
        readinessProbe:
          tcpSocket:
            port: 3001
          periodSeconds: 10
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: uptime-kuma-data-pvc
