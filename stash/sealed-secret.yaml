# SMB credentials for csi-driver-smb (keys must be exactly "username" / "password").
# Regenerate with:
#   kubectl create secret generic stash-secrets -n stash --dry-run=client -o yaml \
#     --from-literal=username=<nas user> --from-literal=password=<nas password> \
#   | kubeseal -o yaml > sealed-secret.yaml
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: stash-secrets
  namespace: stash
spec:
  encryptedData:
    password: 
    username: 
  template:
    metadata:
      name: stash-secrets
      namespace: stash
    type: Opaque
