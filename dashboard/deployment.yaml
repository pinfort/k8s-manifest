apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      deployment: dashboard-deployment
  template:
    metadata:
      labels:
        deployment: dashboard-deployment
    spec:
      serviceAccountName: dashboard
      automountServiceAccountToken: false
      containers:
      - name: dashboard-container
        image: nginxinc/nginx-unprivileged:1.29-alpine
        ports:
        - name: http
          containerPort: 8080
        env:
        - name: K8S_TOKEN
          valueFrom:
            secretKeyRef:
              name: dashboard-token
              key: token
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            memory: 64Mi
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 10
        volumeMounts:
        - name: site
          mountPath: /usr/share/nginx/html
          readOnly: true
        - name: nginx-templates
          mountPath: /etc/nginx/templates
          readOnly: true
        - name: k8s-ca
          mountPath: /etc/k8s
          readOnly: true
      volumes:
      - name: site
        configMap:
          name: dashboard-site
      - name: nginx-templates
        configMap:
          name: dashboard-nginx
      - name: k8s-ca
        secret:
          secretName: dashboard-token
          items:
          - key: ca.crt
            path: ca.crt
